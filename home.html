<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Home</title>
    <link rel="icon" href="./assets/logo.png" type="image/png" />

    <!-- daisy+tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awsoem -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 sticky top-0  z-10 bg-base-200">
      <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <div class="left flex gap-2.5">
          <div class="logo w-[60px]">
            <img src="assets/logo.png" alt="" />
          </div>
          <div class="balance">
            <h2 class="text-2xl font-bold">$<span id="balance">45000</span></h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="index.html" class="btn"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a
          >
        </div>
      </section>
    </header>

    <section class="w-11/12 mx-auto py-10 space-y-4">
      <h2 class="text-3xl font-bold">
        Welcome to Pay<span class="text-primary">oo</span>
      </h2>
      <p class="text-neutral/50">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>
      <div class="buttons grid grid-cols-3 gap-3 py-5">
        <button class="btn flex-col h-full py-4 btn-primary btn-soft" onclick="hideSection('add-money-section')" >
          <img src="assets/opt-1.png" alt="" />
          <p class="text-neutral/50">Add Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft" onclick="hideSection('cash-out-section')">
          <img src="assets/opt-2.png" alt="" />
          <p class="text-neutral/50">Cashout</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="assets/opt-3.png" alt="" />
          <p class="text-neutral/50">Transfer Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="assets/opt-4.png" alt="" />
          <p class="text-neutral/50">Get Bonus</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="assets/opt-5.png" alt="" />
          <p class="text-neutral/50">Pay Bill</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
          <img src="assets/opt-6.png" alt="" />
          <p class="text-neutral/50">Transactions</p>
        </button>
      </div>
    </section>

    <section class=" w-11/12 mx-auto" id="add-money-section">
      <h2 class="text-2xl font-bold py-5">Add Money</h2>

      <div class="card bg-base-100 w-full shadow rounded-3xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Select A Bank</label>
            <select class="select w-full rounded-full" id="bank-option">
              <option disabled selected>Select A back</option>
              <option value="Sonali">Sonali</option>
              <option value="Rupali">Rupali</option>
              <option value="Pubali">Pubali</option>
            </select>
            <br />

            <label class="label text-neutral font-bold">Bank Account Number</label>
            <input
              type="text"
              id="bank-account-number"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit account number"
              maxlength="11"
              minlength="11"
            />
            <br />
            <label class="label text-neutral font-bold">Amount to Add</label>
            <input
              type="number"
              id="amount-to-add"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter amount to Add"
              maxlength="4"
            />
            <br />
            <label id="pinNumber" class="label text-neutral font-bold"
              >Pin Number</label
            >
            <input
              type="password"
              id="add-money-pin"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 digit pin number"
              maxlength="4"
            />

            <button
              id="add-money-btn"
              class="btn btn-primary mt-4 rounded-full"
            >
              Add Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <section class="w-11/12 mx-auto" id="cash-out-section">
      <h2 class="text-2xl font-bold py-5">Cash Out</h2>
      <div class="card bg-base-100 w-full shadow rounded-3xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Agent Number</label>
            <input
              type="text"
              id="agentNumber"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit number"
              maxlength="11"
              minlength="11"
            />
            <br />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              type="number"
              id="amount-cashOut"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter amount to withdraw"
              maxlength="4"
            />
            <br />
            <label id="pinNumber" class="label text-neutral font-bold"
              >Pin Number</label
            >
            <input
              type="password"
              id="login-pin"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 digit pin number"
              maxlength="4"
            />

            <button
              id="cashOutButton"
              class="btn btn-primary mt-4 rounded-full"
            >
              Withdraw Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>
    <script src="scripts/machin.js"></script>
    <script src="scripts/add-money.js"></script>
    <script src="scripts/cashout.js"></script>
    </body>
</html>
